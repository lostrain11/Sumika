name: Release asset boundary

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check_release_assets.py --staged
      - run: python -m unittest tools.test_check_release_assets
