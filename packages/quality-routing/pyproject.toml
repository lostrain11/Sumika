[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quality-routing"
version = "0.1.0"
description = "Host-neutral quality-first task orchestration with explicit authorization"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.12,<2"]

[project.scripts]
quality-routing-mcp = "quality_routing.mcp_server:main"
quality-routing-dsh-helper = "quality_routing.dsh_helper:main"

[tool.setuptools.packages.find]
where = ["src"]
